
services:
  web:
    build: .
    container_name: sait
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
    logging:
      options:
        max-size: "5m"
        max-file: "3"

  scheduler:
    build: .
    container_name: sait-scheduler
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
    command: >
      sh -lc "while true; do
                echo \"[scheduler] $(date) shelly:poll\" ;
                php artisan shelly:poll || true ;
                sleep 60 ;
              done"
    logging:
      options:
        max-size: "5m"
        max-file: "3"

  db:
    image: mysql:8.0
    container_name: SQL
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sait
      MYSQL_USER: sait
      MYSQL_PASSWORD: sait_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    command:
      [
        "--default-authentication-plugin=mysql_native_password",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci"
      ]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -proot -h 127.0.0.1 | grep 'mysqld is alive' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net
    logging:
      options:
        max-size: "5m"
        max-file: "3"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: sait
      PMA_PASSWORD: sait_pass
      MYSQL_ROOT_PASSWORD: root
      UPLOAD_LIMIT: 64M
    ports:
      - "8083:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_net
    logging:
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  db_data:

networks:
  app_net:
    driver: bridge
